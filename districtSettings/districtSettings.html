<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>District Settings</title>
  <!--
    ============================================================================
    District Settings — standalone Canvas wiki deliverable
    Inline CSS + inline JS, zero external dependencies. Pasted directly into the
    [District Settings] page body in the district config course. NOT part of the
    esbuild pipeline, NOT touched by deploy-dev.js / deploy-prod.js / release.js.

    See districtSettings/task.md for the full spec this file implements.

    CSS CLASS / ID CONTRACT
    ------------------------------------------------------------------
    Layout shell .................. .cg-shell
    Sidebar ....................... .cg-sidebar, .cg-logo, .cg-logo-title,
                                    .cg-logo-sub, #cg-nav (nav container)
    Nav item ...................... .cg-nav-item (+ .is-active when selected),
                                    .cg-nav-icon, .cg-nav-label
    Main column ................... .cg-main
    Topbar ........................ .cg-topbar, .cg-topbar-left,
                                    .cg-topbar-title, .cg-district-name,
                                    #cg-save-btn (.cg-save-btn .Button--primary)
    Update banner .................. #cg-update-banner (.cg-update-banner),
                                    .cg-update-banner-text, .cg-update-banner-actions
    Feedback area .................. #cg-feedback (apply a .cg-status-* class)
    Content root ................... #cg-district-settings-root (.cg-content)
    Summary ........................ .cg-summary (grid), .cg-metric-card,
                                    .cg-metric-label, .cg-metric-value
    Panel ........................... .cg-panel, .cg-panel-header, .cg-panel-title,
                                    .cg-panel-chevron, .cg-panel-body
                                    (add .cg-collapsed on .cg-panel to hide body)
    Toggle row ...................... .cg-toggle-row, .cg-toggle-info,
                                    .cg-toggle-label, .cg-toggle-hint,
                                    .cg-toggle-controls,
                                    .cg-toggle (+ .on when enabled), .cg-toggle-thumb,
                                    .cg-lock-btn (+ .locked when locked)
    Canvas loader ................... .cg-code-badge, .cg-code-block, .cg-copy-btn,
                                    .cg-divider, .cg-steps, .cg-step, .cg-step-num
    Status helpers ................... .cg-status-success, .cg-status-warning,
                                    .cg-status-error, .cg-status-info
    ============================================================================
  -->
  <style>
    /* ---- Design tokens ---- */
    :root {
      --cg-primary: #185FA5;
      --cg-success: #0F6E56;
      --cg-text: #111827;
      --cg-text-secondary: #4b5563;
      --cg-text-tertiary: #9ca3af;
      --cg-border: #e5e7eb;
      --cg-border-light: #f3f4f6;
      --cg-page-bg: #f3f4f6;
      --cg-surface: #ffffff;
      --cg-secondary-bg: #f9fafb;
      --cg-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --cg-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --cg-radius-md: 6px;
      --cg-radius-lg: 12px;
    }

    /* ---- Base ---- */
    .cg-shell, .cg-shell * { box-sizing: border-box; }
    .cg-shell {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 100vh;
      font-family: var(--cg-font);
      font-size: 14px;
      line-height: 1.5;
      color: var(--cg-text);
      background: var(--cg-surface);
    }

    /* ---- Sidebar ---- */
    .cg-sidebar {
      background: var(--cg-secondary-bg);
      border-right: 0.5px solid var(--cg-border);
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    .cg-logo {
      padding: 20px 16px 16px;
      border-bottom: 0.5px solid var(--cg-border);
    }
    .cg-logo-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--cg-text);
      letter-spacing: -0.2px;
    }
    .cg-logo-sub {
      font-size: 11px;
      color: var(--cg-text-tertiary);
      margin-top: 2px;
    }
    .cg-nav-section-label {
      font-size: 10px;
      color: var(--cg-text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 12px 16px 4px;
    }
    #cg-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 4px 8px;
    }
    .cg-nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: var(--cg-radius-md);
      font-size: 13px;
      color: var(--cg-text-secondary);
      cursor: pointer;
      transition: background 0.1s;
      user-select: none;
    }
    .cg-nav-item:hover { background: var(--cg-surface); color: var(--cg-text); }
    .cg-nav-item.is-active {
      background: var(--cg-surface);
      color: var(--cg-text);
      font-weight: 500;
    }
    .cg-nav-icon { width: 16px; text-align: center; font-size: 15px; color: var(--cg-text-tertiary); }
    .cg-nav-label { flex: 1; }

    /* ---- Main column ---- */
    .cg-main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--cg-page-bg);
      overflow-y: auto;
    }
    .cg-topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 0.5px solid var(--cg-border);
      background: var(--cg-surface);
      flex-shrink: 0;
    }
    .cg-topbar-left { display: flex; flex-direction: column; }
    .cg-topbar-title { font-size: 15px; font-weight: 500; color: var(--cg-text); }
    .cg-district-name { font-size: 12px; color: var(--cg-text-tertiary); margin-top: 1px; }

    /* ---- Save button ---- */
    .cg-save-btn, .Button--primary {
      background: var(--cg-primary);
      color: #fff;
      border: 0.5px solid var(--cg-primary);
      padding: 5px 12px;
      border-radius: var(--cg-radius-md);
      font-size: 12px;
      font-family: var(--cg-font);
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .cg-save-btn:disabled { opacity: 0.7; cursor: default; }

    /* ---- Update banner ---- */
    #cg-update-banner:empty { display: none; }
    .cg-update-banner {
      margin: 12px 20px 0;
      padding: 10px 14px;
      border-radius: var(--cg-radius-md);
      background: #eff6ff;
      border: 0.5px solid #dbeafe;
      color: #1d4ed8;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .cg-update-banner-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .cg-update-btn, .cg-dismiss-btn {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: var(--cg-radius-md);
      border: 0.5px solid #1d4ed8;
      background: #fff;
      color: #1d4ed8;
      cursor: pointer;
    }
    .cg-dismiss-btn { border-color: var(--cg-border); color: var(--cg-text-tertiary); }

    /* ---- Feedback area ---- */
    #cg-feedback { padding: 0 20px; }
    #cg-feedback:empty { display: none; }
    #cg-feedback .cg-feedback-msg {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: var(--cg-radius-md);
      font-size: 12px;
      border: 0.5px solid var(--cg-border);
    }

    /* ---- Status helpers ---- */
    .cg-status-success { background: #f0fdf4; border-color: #bbf7d0; color: #15803d; }
    .cg-status-warning { background: #fffbeb; border-color: #fef3c7; color: #a16207; }
    .cg-status-error   { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
    .cg-status-info    { background: #eff6ff; border-color: #dbeafe; color: #1d4ed8; }

    /* ---- Content area ---- */
    .cg-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 900px;
    }

    /* ---- Summary ---- */
    .cg-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .cg-metric-card {
      background: var(--cg-secondary-bg);
      border-radius: var(--cg-radius-md);
      padding: 12px 14px;
      border: 0.5px solid var(--cg-border-light);
    }
    .cg-metric-label {
      font-size: 11px;
      color: var(--cg-text-tertiary);
      margin-bottom: 4px;
    }
    .cg-metric-value {
      font-size: 18px;
      font-weight: 500;
      color: var(--cg-text);
    }
    .cg-metric-value.blue { color: var(--cg-primary); }
    .cg-metric-value.green { color: var(--cg-success); }
    .cg-metric-value.amber { color: #854F0B; }

    /* ---- Panels ---- */
    .cg-panel {
      border: 0.5px solid var(--cg-border);
      border-radius: var(--cg-radius-lg);
      background: var(--cg-surface);
      overflow: hidden;
    }
    .cg-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }
    .cg-panel-header:hover { background: var(--cg-secondary-bg); }
    .cg-panel-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; }
    .cg-panel-title i { font-size: 15px; color: var(--cg-text-tertiary); }
    .cg-panel-chevron { color: var(--cg-text-tertiary); font-size: 14px; }
    .cg-panel-body {
      padding: 16px;
      border-top: 0.5px solid var(--cg-border);
    }
    .cg-panel.cg-collapsed .cg-panel-body { display: none; }
    .cg-panel.cg-collapsed { border-color: var(--cg-border-light); }

    /* ---- Toggle rows ---- */
    .cg-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 0;
      border-bottom: 0.5px solid var(--cg-border-light);
    }
    .cg-toggle-row:last-child { border-bottom: none; }
    .cg-toggle-info { min-width: 0; }
    .cg-toggle-label { font-size: 13px; color: var(--cg-text); }
    .cg-toggle-hint { font-size: 11px; color: var(--cg-text-tertiary); margin-top: 2px; }
    .cg-toggle-controls { display: flex; align-items: center; gap: 10px; flex: none; }

    /* ---- Toggle switch ---- */
    .cg-toggle {
      position: relative;
      flex: none;
      width: 32px;
      height: 18px;
      border-radius: 99px;
      background: var(--cg-secondary-bg);
      border: 0.5px solid var(--cg-border);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .cg-toggle.on { background: var(--cg-primary); border-color: var(--cg-primary); }
    .cg-toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      transition: left 0.15s ease;
    }
    .cg-toggle.on .cg-toggle-thumb { left: 16px; }

    /* ---- Lock button ---- */
    .cg-lock-btn {
      flex: none;
      width: 22px;
      height: 22px;
      border-radius: var(--cg-radius-md);
      border: 0.5px solid var(--cg-border);
      background: var(--cg-surface);
      color: var(--cg-text-tertiary);
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .cg-lock-btn.locked {
      border-color: #854F0B;
      color: #854F0B;
      background: #fffbeb;
    }

    /* ---- Simplified Loader ---- */
    .cg-loader-course-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .cg-loader-course-label { font-size: 12px; color: var(--cg-text-secondary); }
    .cg-loader-course-value {
      font-family: var(--cg-mono); font-size: 14px; font-weight: 500;
      background: var(--cg-secondary-bg); border: 0.5px solid var(--cg-border);
      border-radius: var(--cg-radius-md); padding: 5px 10px;
    }
    .cg-loader-hint { font-size: 12px; color: var(--cg-text-tertiary); }
    .cg-loader-code-wrap { position: relative; margin: 10px 0; }
    .cg-loader-code {
      background: var(--cg-secondary-bg); border: 0.5px solid var(--cg-border);
      border-radius: var(--cg-radius-md); padding: 14px;
      font-family: var(--cg-mono); font-size: 12px; line-height: 1.8;
      color: var(--cg-text-secondary); overflow-x: auto;
    }
    .cg-loader-kw { color: var(--cg-primary); font-weight: 500; }
    .cg-loader-str { color: var(--cg-success); }
    .cg-loader-copy-btn {
      position: absolute; top: 8px; right: 8px;
      font-size: 11px; padding: 4px 10px; border-radius: var(--cg-radius-md);
      border: 0.5px solid var(--cg-border); background: var(--cg-surface);
      color: var(--cg-text-secondary); cursor: pointer;
      display: flex; align-items: center; gap: 4px;
    }
    .cg-loader-copy-btn.copied { color: var(--cg-success); border-color: var(--cg-success); }
    .cg-loader-divider { height: 0.5px; background: var(--cg-border); margin: 16px 0; }
    .cg-loader-steps { display: flex; flex-direction: column; gap: 6px; }
    .cg-loader-step { display: flex; align-items: baseline; gap: 8px; font-size: 12px; color: var(--cg-text-secondary); }
    .cg-loader-step-num { font-size: 11px; font-weight: 500; color: var(--cg-text-tertiary); min-width: 14px; }
  </style>
</head>
<body>
  <!-- ============================== LAYOUT ============================== -->
  <div class="cg-shell">
    <!-- Sidebar -->
    <aside class="cg-sidebar">
      <div class="cg-logo">
        <div class="cg-logo-title">Customized Gradebook</div>
        <div class="cg-logo-sub">District Settings</div>
      </div>
      <nav id="cg-nav"><!-- nav items rendered by renderSidebar() --></nav>
    </aside>

    <!-- Main column -->
    <main class="cg-main">
      <div class="cg-topbar">
        <div class="cg-topbar-left">
          <div class="cg-topbar-title">District Settings</div>
          <div class="cg-district-name">District configuration</div>
        </div>
        <button id="cg-save-btn" class="cg-save-btn Button--primary" type="button">💾 Save</button>
      </div>

      <!-- Self-update banner (hidden unless a newer version is detected) -->
      <div id="cg-update-banner"></div>

      <!-- Inline error / feedback area -->
      <div id="cg-feedback"></div>

      <!-- Scrollable content area populated by JS rendering -->
      <div id="cg-district-settings-root" class="cg-content"></div>
    </main>
  </div>

  <!-- ============================== SCRIPT ============================== -->
  <script>
  (function () {
    'use strict';

    // ========================================================================
    // Self-update version. Every commit that changes this file must, in the
    // same commit, bump this constant AND districtSettings/district-settings-manifest.json's
    // "version" field (plus a meaningful "notes" line there) so the banner
    // below can detect a newer version is available. The manifest's "url"
    // field doesn't need to change commit-to-commit — it already always
    // points at this file's raw content on `main`. This only affects THIS
    // page's own body — it never touches the [District Config] settings file,
    // and it has no relationship to versions.json/mobile-versions.json or any
    // release-tag-triggered workflow (see districtSettings/task.md).
    // ========================================================================
    var CG_DS_VERSION = '2026.08.26-1';
    var MANIFEST_URL = 'https://raw.githubusercontent.com/MOREnet-Canvas/CustomizedGradebook/main/districtSettings/district-settings-manifest.json';

    // ========================================================================
    // Round 1 district-lockable settings.
    // Each entry is { value, locked } — see districtSettings/task.md.
    // Labels/hints match src/config.js's own comments for these same keys.
    // ========================================================================
    var ROUND1_FLAGS = [
      { key: 'ENFORCE_COURSE_OVERRIDE', label: 'Enforce course override', hint: 'Sets course override via API on every sync' },
      { key: 'ENFORCE_COURSE_GRADING_SCHEME', label: 'Enforce grading scheme', hint: 'Sets grading scheme via API on every sync' },
      { key: 'ENABLE_GRADE_CUSTOM_STATUS', label: 'Custom grade statuses', hint: 'Apply custom status labels when outcomes lack evidence' },
      { key: 'ENABLE_NEGATIVE_ZERO_COUNT', label: 'Zero grade penalty', hint: 'Each zero subtracts 1 from the score' }
    ];

    var DEFAULT_SETTINGS = {};
    ROUND1_FLAGS.forEach(function (f) {
      DEFAULT_SETTINGS[f.key] = { value: false, locked: false };
    });

    function deepCopy(obj) {
      return JSON.parse(JSON.stringify(obj));
    }

    // ========================================================================
    // Runtime state
    // ========================================================================
    var state = {
      courseId: 'COURSE_ID',
      csrfToken: '',
      settings: deepCopy(DEFAULT_SETTINGS)
    };

    // ========================================================================
    // Environment helpers
    // ========================================================================
    function getCourseId() {
      var match = (window.location.pathname || '').match(/\/courses\/(\d+)/);
      state.courseId = match ? match[1] : 'COURSE_ID';
      return state.courseId;
    }

    function getPageSlug() {
      var match = (window.location.pathname || '').match(/\/courses\/\d+\/pages\/([^/]+)/);
      return match ? match[1] : null;
    }

    function getCsrfToken() {
      var meta = document.querySelector('meta[name="csrf-token"]');
      if (meta && meta.content) {
        state.csrfToken = meta.content;
        return state.csrfToken;
      }
      var cookieMatch = (document.cookie || '').match(/_csrf_token=([^;]+)/);
      state.csrfToken = cookieMatch ? decodeURIComponent(cookieMatch[1]) : '';
      return state.csrfToken;
    }

    function hasCourse() {
      return !!state.courseId && state.courseId !== 'COURSE_ID';
    }

    // ========================================================================
    // Minimal Canvas API request helper — hand-lifted from
    // src/utils/canvasApiClient.js's CSRF logic (cookie read, X-CSRF-Token
    // header, authenticity_token body field), since this file can't import
    // anything. safeFetch/safeJsonParse/logger are intentionally not ported —
    // plain fetch + console are used instead.
    // ========================================================================
    async function cgApiRequest(method, url, data) {
      var headers = { 'X-CSRF-Token': state.csrfToken };
      var body = null;
      if (data) {
        headers['Content-Type'] = 'application/json';
        var payload = data.authenticity_token
          ? data
          : Object.assign({}, data, { authenticity_token: state.csrfToken });
        body = JSON.stringify(payload);
      }
      var res = await fetch(url, {
        method: method,
        credentials: 'same-origin',
        headers: headers,
        body: body
      });
      if (!res.ok) {
        throw new Error(method + ' ' + url + ' -> ' + res.status);
      }
      var text = await res.text();
      return text ? JSON.parse(text) : null;
    }
    function cgApiGet(url) { return cgApiRequest('GET', url, null); }
    function cgApiPost(url, data) { return cgApiRequest('POST', url, data); }
    function cgApiPut(url, data) { return cgApiRequest('PUT', url, data); }

    // ========================================================================
    // Data layer — Canvas Files API (mirrors src/services/districtConfigService.js)
    // Config is stored as a JSON file in the district course:
    //   MOREnet_CustomizedGradebook/district_config/district_config.json
    //
    // Deliberately NOT locked (unlike the folder/file locking Canvas usually
    // uses for teacher-only caches, e.g. mastery_outlook_cache.json). Confirmed
    // by live testing on morenetlab course 581: a locked file blocks
    // institution-visibility reads even for authenticated students — Canvas
    // checks the `locked` flag before `visibility_level`. Write access is
    // already restricted by this course's manage_files permission, so leaving
    // the folder/file unlocked adds no real exposure and is required for
    // students to be able to read district config later.
    // ========================================================================
    var SCHEMA_VERSION = 1;
    var PARENT_FOLDER_NAME = 'MOREnet_CustomizedGradebook';
    var FOLDER_NAME = 'district_config';
    var FILE_NAME = 'district_config.json';

    // Per-page memoized subfolder id (reset on write failure).
    var _folderId = null;

    // Find-or-create a folder by name under parentId. Never locked — see
    // header comment above for why.
    async function ensureNamedFolder(name, parentId) {
      try {
        var list = await cgApiGet(
          '/api/v1/courses/' + state.courseId + '/folders?per_page=100'
        );
        if (Array.isArray(list)) {
          var existing = list.find(function (f) {
            return f.name === name && f.parent_folder_id === parentId && !f.deleted;
          });
          if (existing) { return existing.id; }
        }
      } catch (e) { /* fall through to create */ }

      var folder = await cgApiPost('/api/v1/courses/' + state.courseId + '/folders', {
        name: name,
        parent_folder_id: parentId,
        hidden: false,
        locked: false
      });
      return folder.id;
    }

    // Ensure MOREnet_CustomizedGradebook/district_config/ exists; returns subfolder id.
    async function ensureFolder() {
      if (_folderId) { return _folderId; }
      var root = await cgApiGet('/api/v1/courses/' + state.courseId + '/folders/root');
      var parentId = await ensureNamedFolder(PARENT_FOLDER_NAME, root.id);
      var subId = await ensureNamedFolder(FOLDER_NAME, parentId);
      _folderId = subId;
      return subId;
    }

    // Merge a parsed settings object onto the defaults, key by key, ignoring
    // unknown keys and any entry with the wrong shape. A key entirely absent
    // from the stored file just keeps its default — this is what makes adding
    // a new round of lockable keys later backward-compatible with older files.
    function mergeSettings(parsedSettings) {
      var merged = deepCopy(DEFAULT_SETTINGS);
      if (parsedSettings && typeof parsedSettings === 'object') {
        Object.keys(merged).forEach(function (key) {
          var entry = parsedSettings[key];
          if (entry && typeof entry === 'object') {
            if (typeof entry.value === 'boolean') { merged[key].value = entry.value; }
            if (typeof entry.locked === 'boolean') { merged[key].locked = entry.locked; }
          }
        });
      }
      return merged;
    }

    async function loadConfig() {
      try {
        if (!hasCourse()) { return; }
        var url = '/api/v1/courses/' + state.courseId + '/files'
          + '?search_term=' + encodeURIComponent(FILE_NAME)
          + '&content_types[]=application/json&per_page=10';
        var results = await cgApiGet(url);
        if (!Array.isArray(results)) { return; }
        var file = results.find(function (f) {
          return f.display_name === FILE_NAME && f['content-type'] === 'application/json';
        });
        if (!file || !file.url) { return; }
        var resp = await fetch(file.url, { credentials: 'include' });
        if (!resp.ok) { return; }
        var data = JSON.parse(await resp.text());
        if (!data || data.schemaVersion !== SCHEMA_VERSION) { return; }
        state.settings = mergeSettings(data.settings);
      } catch (err) {
        // Keep defaults silently on any failure, 404, or malformed JSON.
      }
    }

    // Write config as a JSON file using Canvas' 3-step upload protocol.
    async function saveConfig() {
      if (!hasCourse()) { return false; }
      try {
        var folderId = await ensureFolder();

        var payload = {
          schemaVersion: SCHEMA_VERSION,
          updatedAt: new Date().toISOString(),
          settings: state.settings
        };
        var jsonContent = JSON.stringify(payload, null, 2);
        var fileSize = new Blob([jsonContent]).size;

        // Step 1: request upload instructions.
        var upload = await cgApiPost('/api/v1/courses/' + state.courseId + '/files', {
          name: FILE_NAME,
          size: fileSize,
          content_type: 'application/json',
          parent_folder_id: folderId,
          on_duplicate: 'overwrite'
        });

        // Step 2: upload file content to Canvas storage.
        var formData = new FormData();
        Object.keys(upload.upload_params).forEach(function (key) {
          formData.append(key, upload.upload_params[key]);
        });
        formData.append('file',
          new Blob([jsonContent], { type: 'application/json' }), FILE_NAME);
        var uploadRes = await fetch(upload.upload_url, {
          method: 'POST',
          body: formData,
          credentials: 'include'
        });
        if (!uploadRes.ok) { _folderId = null; return false; }
        var uploaded = await uploadRes.json();

        // Step 3: confirm upload and set student-readable visibility.
        // Intentionally NOT locked — see the data-layer comment above for why.
        await cgApiPut('/api/v1/files/' + uploaded.id, {
          locked: false,
          hidden: false,
          visibility_level: 'institution'
        });
        return true;
      } catch (err) {
        // Folder id may be stale — force re-discovery on next save.
        _folderId = null;
        return false;
      }
    }

    // ========================================================================
    // Inline feedback (no alert() anywhere)
    // ========================================================================
    function showFeedback(message, type) {
      var el = document.getElementById('cg-feedback');
      if (!el) { return; }
      if (!message) { el.innerHTML = ''; return; }
      var statusClass = 'cg-status-info';
      if (type === 'success') { statusClass = 'cg-status-success'; }
      else if (type === 'warning') { statusClass = 'cg-status-warning'; }
      else if (type === 'error') { statusClass = 'cg-status-error'; }
      var msg = document.createElement('div');
      msg.className = 'cg-feedback-msg ' + statusClass;
      msg.textContent = message;
      el.innerHTML = '';
      el.appendChild(msg);
    }

    // ========================================================================
    // Section registry (drives sidebar nav + collapse order)
    // ========================================================================
    var NAV_GROUPS = [
      {
        label: 'Overview',
        items: [
          { id: 'cg-section-summary', label: 'Summary', icon: '▦' }
        ]
      },
      {
        label: 'Configuration',
        items: [
          { id: 'cg-section-flags', label: 'Feature flags', icon: '⚑' }
        ]
      },
      {
        label: 'Deploy',
        items: [
          { id: 'cg-section-loader', label: 'Canvas loader', icon: '↧' }
        ]
      }
    ];

    // Flat list for easy lookup
    var SECTIONS = [];
    NAV_GROUPS.forEach(function (g) {
      g.items.forEach(function (i) { SECTIONS.push(i); });
    });

    // ========================================================================
    // DOM helpers
    // ========================================================================
    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) { node.className = className; }
      if (text != null) { node.textContent = text; }
      return node;
    }

    function getRoot() {
      return document.getElementById('cg-district-settings-root');
    }

    function makePanel(id, title) {
      var panel = el('div', 'cg-panel');
      panel.id = id;
      var iconText = '';
      for (var i = 0; i < SECTIONS.length; i++) {
        if (SECTIONS[i].id === id) { iconText = SECTIONS[i].icon; break; }
      }
      var header = el('div', 'cg-panel-header');
      var titleEl = el('span', 'cg-panel-title');
      if (iconText) {
        var iconEl = el('i', null, iconText);
        titleEl.appendChild(iconEl);
      }
      titleEl.appendChild(document.createTextNode(' ' + title));
      header.appendChild(titleEl);
      header.appendChild(el('span', 'cg-panel-chevron', '▼'));
      var body = el('div', 'cg-panel-body');
      panel.appendChild(header);
      panel.appendChild(body);
      return { panel: panel, body: body };
    }

    function setPanelCollapsed(panel, collapsed) {
      if (!panel) { return; }
      if (collapsed) { panel.classList.add('cg-collapsed'); }
      else { panel.classList.remove('cg-collapsed'); }
      var chevron = panel.querySelector('.cg-panel-chevron');
      if (chevron) { chevron.textContent = collapsed ? '▶' : '▼'; }
    }

    // Toggle + padlock row for one district-lockable setting.
    // Locked  = district value wins outright for every course.
    // Unlocked = district value is only a default (no per-course store exists
    //            yet, so today this is functionally equivalent to locked —
    //            see districtSettings/task.md).
    function makeLockableToggleRow(flag) {
      var entry = state.settings[flag.key];
      var row = el('div', 'cg-toggle-row');

      var info = el('div', 'cg-toggle-info');
      info.appendChild(el('div', 'cg-toggle-label', flag.label));
      info.appendChild(el('div', 'cg-toggle-hint', flag.hint));

      var controls = el('div', 'cg-toggle-controls');

      var toggle = el('div', 'cg-toggle');
      toggle.appendChild(el('span', 'cg-toggle-thumb'));
      if (entry.value) { toggle.classList.add('on'); }
      toggle.addEventListener('click', function () {
        entry.value = !entry.value;
        toggle.classList.toggle('on', entry.value);
      });

      var lockBtn = el('button', 'cg-lock-btn');
      lockBtn.type = 'button';
      function syncLock() {
        lockBtn.classList.toggle('locked', entry.locked);
        lockBtn.textContent = entry.locked ? '🔒' : '🔓';
        lockBtn.title = entry.locked
          ? 'Locked — this value applies to every course, overriding any per-course setting'
          : 'Unlocked — this value is only a default';
      }
      lockBtn.addEventListener('click', function () {
        entry.locked = !entry.locked;
        syncLock();
      });
      syncLock();

      controls.appendChild(toggle);
      controls.appendChild(lockBtn);
      row.appendChild(info);
      row.appendChild(controls);
      return row;
    }

    // ========================================================================
    // Clipboard helper (with execCommand fallback)
    // ========================================================================
    function fallbackCopy(text) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e) { /* ignore */ }
    }

    function copyToClipboard(text, btn) {
      var original = '⎘ Copy';
      function done() {
        btn.textContent = '✓';
        setTimeout(function () { btn.textContent = original; }, 2000);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () {
          fallbackCopy(text);
          done();
        });
      } else {
        fallbackCopy(text);
        done();
      }
    }

    // ========================================================================
    // Section renderers
    // ========================================================================
    function renderSummary() {
      var root = getRoot();
      if (!root) { return; }
      var panel = document.getElementById('cg-section-summary');
      var body;
      if (!panel) {
        var made = makePanel('cg-section-summary', 'Summary');
        panel = made.panel;
        body = made.body;
        root.appendChild(panel);
      } else {
        body = panel.querySelector('.cg-panel-body');
        body.innerHTML = '';
      }
      var grid = el('div', 'cg-summary');
      ROUND1_FLAGS.forEach(function (flag) {
        var entry = state.settings[flag.key];
        var cd = el('div', 'cg-metric-card');
        cd.appendChild(el('div', 'cg-metric-label', flag.label));
        var valueText = (entry.value ? 'on' : 'off') + (entry.locked ? ' 🔒' : '');
        var val = el('div', 'cg-metric-value', valueText);
        if (entry.value) { val.classList.add(entry.locked ? 'amber' : 'green'); }
        cd.appendChild(val);
        grid.appendChild(cd);
      });
      body.appendChild(grid);
    }

    function renderFeatureFlags() {
      var made = makePanel('cg-section-flags', 'Feature flags');
      ROUND1_FLAGS.forEach(function (flag) {
        made.body.appendChild(makeLockableToggleRow(flag));
      });
      getRoot().appendChild(made.panel);
    }

    function renderCanvasLoader() {
      var made = makePanel('cg-section-loader', 'Canvas loader');
      var body = made.body;

      var courseRow = el('div', 'cg-loader-course-row');
      courseRow.appendChild(el('span', 'cg-loader-course-label', 'District config course ID'));
      courseRow.appendChild(el('span', 'cg-loader-course-value', state.courseId));
      courseRow.appendChild(el('span', 'cg-loader-hint', 'detected from this page\'s URL'));
      body.appendChild(courseRow);

      body.appendChild(el('div', 'cg-loader-divider'));

      var hint = el('div');
      hint.style.fontSize = '12px';
      hint.style.color = 'var(--cg-text-secondary)';
      hint.style.marginBottom = '10px';
      hint.innerHTML = 'Paste this into your Canvas Theme Editor under <strong>JavaScript file</strong>:';
      body.appendChild(hint);

      var codeWrap = el('div', 'cg-loader-code-wrap');
      var codeBlock = el('div', 'cg-loader-code');

      // Build syntax highlighted snippet
      codeBlock.innerHTML =
        '<span class="cg-loader-kw">var</span> CG_DISTRICT_COURSE = <span class="cg-loader-str">\'' + state.courseId + '\'</span>;<br>' +
        '<span class="cg-loader-kw">var</span> CG_BASE = <span class="cg-loader-str">\'https://cdn.morenet.net/cg/\'</span>;<br>' +
        '<span class="cg-loader-kw">var</span> s = document.createElement(<span class="cg-loader-str">\'script\'</span>);<br>' +
        's.src = CG_BASE + <span class="cg-loader-str">\'dist/main.js\'</span>;<br>' +
        'document.head.appendChild(s);';

      var plainText = "var CG_DISTRICT_COURSE = '" + state.courseId + "';\n" +
        "var CG_BASE = 'https://cdn.morenet.net/cg/';\n" +
        "var s = document.createElement('script');\n" +
        "s.src = CG_BASE + 'dist/main.js';\n" +
        "document.head.appendChild(s);";

      var copyBtn = el('button', 'cg-loader-copy-btn', '⎘ Copy');
      copyBtn.type = 'button';
      copyBtn.addEventListener('click', function () {
        copyToClipboard(plainText, copyBtn);
        copyBtn.classList.add('copied');
        copyBtn.textContent = '✓ Copied';
        setTimeout(function () {
          copyBtn.classList.remove('copied');
          copyBtn.textContent = '⎘ Copy';
        }, 2000);
      });

      codeWrap.appendChild(codeBlock);
      codeWrap.appendChild(copyBtn);
      body.appendChild(codeWrap);

      body.appendChild(el('div', 'cg-loader-divider'));

      var steps = el('div', 'cg-loader-steps');
      var stepTexts = [
        'Copy the snippet above',
        'In Canvas, go to <strong>Admin → Themes → Edit theme → JavaScript file</strong>',
        'Paste and save — teachers will pick up district settings automatically'
      ];
      stepTexts.forEach(function (t, i) {
        var step = el('div', 'cg-loader-step');
        step.appendChild(el('span', 'cg-loader-step-num', (i + 1)));
        var span = el('span');
        span.innerHTML = t;
        step.appendChild(span);
        steps.appendChild(step);
      });
      body.appendChild(steps);

      getRoot().appendChild(made.panel);
    }

    // ========================================================================
    // Sidebar nav
    // ========================================================================
    function renderSidebar() {
      var nav = document.getElementById('cg-nav');
      if (!nav) { return; }
      nav.innerHTML = '';

      NAV_GROUPS.forEach(function (group) {
        nav.appendChild(el('div', 'cg-nav-section-label', group.label));

        group.items.forEach(function (sec) {
          var item = el('div', 'cg-nav-item');
          item.id = 'nav-' + sec.id;
          item.appendChild(el('span', 'cg-nav-icon', sec.icon));
          item.appendChild(el('span', 'cg-nav-label', sec.label));

          // Default active state for the first item in the first group
          if (sec.id === 'cg-section-summary') { item.classList.add('is-active'); }

          item.addEventListener('click', function () {
            var items = nav.querySelectorAll('.cg-nav-item');
            Array.prototype.forEach.call(items, function (n) { n.classList.remove('is-active'); });
            item.classList.add('is-active');

            var root = getRoot();
            if (root) {
              var panels = root.querySelectorAll('.cg-panel');
              Array.prototype.forEach.call(panels, function (p) {
                setPanelCollapsed(p, p.id !== sec.id);
              });
            }

            var target = document.getElementById(sec.id);
            if (target && target.scrollIntoView) {
              target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          });
          nav.appendChild(item);
        });
      });
    }

    // ========================================================================
    // Render everything
    // ========================================================================
    function renderAll() {
      var root = getRoot();
      if (!root) { return; }
      root.innerHTML = '';
      renderSummary();
      renderFeatureFlags();
      renderCanvasLoader();
      // Only the Summary section is expanded by default.
      var panels = root.querySelectorAll('.cg-panel');
      Array.prototype.forEach.call(panels, function (p) {
        setPanelCollapsed(p, p.id !== 'cg-section-summary');
      });
      renderSidebar();
    }

    // ========================================================================
    // Interaction wiring
    // ========================================================================
    function bindInteractions() {
      var root = getRoot();
      if (!root) { return; }
      // Toggle a panel's collapse state when its header is clicked.
      // When a panel is expanded this way, sync the sidebar nav's is-active indicator.
      root.addEventListener('click', function (e) {
        var header = e.target.closest ? e.target.closest('.cg-panel-header') : null;
        if (!header) { return; }
        var panel = e.target.closest('.cg-panel');
        if (!panel) { return; }
        var isCollapsed = panel.classList.contains('cg-collapsed');
        setPanelCollapsed(panel, !isCollapsed);
        // If the panel is being expanded, mark its nav item active.
        if (isCollapsed) {
          var nav = document.getElementById('cg-nav');
          if (nav) {
            var items = nav.querySelectorAll('.cg-nav-item');
            Array.prototype.forEach.call(items, function (item) {
              if (item.id === 'nav-' + panel.id) { item.classList.add('is-active'); }
              else { item.classList.remove('is-active'); }
            });
          }
        }
      });
    }

    // ========================================================================
    // Save handler
    // ========================================================================
    async function handleSave() {
      var btn = document.getElementById('cg-save-btn');
      var original = '💾 Save';
      showFeedback('', null);
      if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
      var ok = await saveConfig();
      if (ok) {
        // Refresh summary cards immediately to reflect saved values.
        renderSummary();
        if (btn) {
          btn.textContent = '✓ Saved';
          btn.style.background = 'var(--cg-success)';
          btn.style.borderColor = 'var(--cg-success)';
          setTimeout(function () {
            btn.textContent = original;
            btn.style.background = '';
            btn.style.borderColor = '';
            btn.disabled = false;
          }, 1500);
        }
      } else {
        if (btn) { btn.disabled = false; btn.textContent = original; }
        showFeedback('Could not save settings. Please try again.', 'error');
      }
    }

    // ========================================================================
    // Self-update mechanism for THIS page only ([District Settings]).
    // Never touches [District Config] / district_config.json — settings saved
    // by handleSave() above are completely unaffected by applying an update.
    // Fails silently on any manifest-check error — a missed update check is
    // not worth surfacing to the admin as an error.
    // ========================================================================
    async function checkForUpdate() {
      try {
        var res = await fetch(MANIFEST_URL + '?t=' + Date.now());
        if (!res.ok) { return; }
        var manifest = await res.json();
        if (manifest && manifest.version && manifest.version !== CG_DS_VERSION) {
          showUpdateBanner(manifest);
        }
      } catch (e) {
        // Fail silent — see comment above.
      }
    }

    function showUpdateBanner(manifest) {
      var container = document.getElementById('cg-update-banner');
      if (!container) { return; }
      container.innerHTML = '';

      var banner = el('div', 'cg-update-banner');
      var text = el('div', 'cg-update-banner-text');
      text.textContent = 'Update available (v' + manifest.version + ')'
        + (manifest.notes ? ' — ' + manifest.notes : '');

      var actions = el('div', 'cg-update-banner-actions');
      var updateBtn = el('button', 'cg-update-btn', 'Update');
      updateBtn.type = 'button';
      updateBtn.addEventListener('click', function () { handleApplyUpdate(manifest); });

      var dismissBtn = el('button', 'cg-dismiss-btn', 'Dismiss');
      dismissBtn.type = 'button';
      dismissBtn.addEventListener('click', function () { container.innerHTML = ''; });

      actions.appendChild(updateBtn);
      actions.appendChild(dismissBtn);
      banner.appendChild(text);
      banner.appendChild(actions);
      container.appendChild(banner);
    }

    async function handleApplyUpdate(manifest) {
      var pageSlug = getPageSlug();
      if (!pageSlug) {
        showFeedback('Cannot self-update: this page is not being viewed at its normal Canvas page URL.', 'error');
        return;
      }
      var confirmed = window.confirm(
        'This replaces this page\'s entire content with version ' + manifest.version + '.\n\n' +
        (manifest.notes ? manifest.notes + '\n\n' : '') +
        'Your saved district settings are stored separately and will not be affected. Continue?'
      );
      if (!confirmed) { return; }
      try {
        var htmlRes = await fetch(manifest.url + '?t=' + Date.now());
        if (!htmlRes.ok) { throw new Error('Could not fetch new version: ' + htmlRes.status); }
        var newHtml = await htmlRes.text();
        await cgApiPut('/api/v1/courses/' + state.courseId + '/pages/' + pageSlug, {
          wiki_page: { body: newHtml }
        });
        document.getElementById('cg-update-banner').innerHTML = '';
        showFeedback('Updated to v' + manifest.version + '. Reload this page to see the new version.', 'success');
      } catch (err) {
        showFeedback('Update failed: ' + (err && err.message ? err.message : 'unknown error'), 'error');
      }
    }

    // ========================================================================
    // Init
    // ========================================================================
    async function init() {
      getCourseId();
      getCsrfToken();
      await loadConfig();
      renderAll();
      bindInteractions();
      var btn = document.getElementById('cg-save-btn');
      if (btn) { btn.addEventListener('click', handleSave); }
      checkForUpdate();
    }

    document.addEventListener('DOMContentLoaded', init);
  })();
  </script>
</body>
